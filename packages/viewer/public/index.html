<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --surface: #1a2332;
        --border: #2d3a4d;
        --text: #e7ecf3;
        --muted: #8b9cb3;
        --accent: #5b9cf5;
        --ok: #3ecf8e;
        --warn: #e9b44d;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6f9;
          --surface: #fff;
          --border: #d4dbe7;
          --text: #1a2332;
          --muted: #5c6b80;
          --accent: #2563eb;
          --ok: #059669;
          --warn: #b45309;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        max-width: 48rem;
        word-break: break-all;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 0.35rem 0.75rem;
        border-radius: 6px;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      main {
        padding: 1rem 1.25rem 2.5rem;
        max-width: 960px;
        margin: 0 auto;
      }
      .banner {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .banner.error {
        border-color: #c94c4c;
      }
      .epic {
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 0.75rem;
        background: var(--surface);
        overflow: hidden;
      }
      .epic summary {
        list-style: none;
        cursor: pointer;
        padding: 0.75rem 1rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: baseline;
      }
      .epic summary::-webkit-details-marker {
        display: none;
      }
      .epic summary::before {
        content: '\25B6';
        display: inline-block;
        width: 1rem;
        color: var(--muted);
        font-size: 0.65rem;
      }
      .epic[open] summary::before {
        content: '\25BC';
      }
      .epic-title {
        font-weight: 600;
        flex: 1 1 12rem;
      }
      .badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.15rem 0.45rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.active-focus {
        border-color: var(--accent);
        color: var(--accent);
      }
      .progress {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .epic-body {
        padding: 0 1rem 1rem 2.25rem;
        border-top: 1px solid var(--border);
      }
      .epic-desc {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0.75rem 0 0;
        white-space: pre-wrap;
      }
      .story {
        margin-top: 0.75rem;
        border-left: 2px solid var(--border);
        padding-left: 0.75rem;
      }
      .story-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.75rem;
        align-items: baseline;
      }
      .story-title {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .task {
        margin: 0.5rem 0 0 0.5rem;
        font-size: 0.85rem;
      }
      .task-title {
        font-weight: 500;
      }
      .steps {
        margin: 0.25rem 0 0 1rem;
        padding: 0;
        list-style: none;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .steps li.done {
        text-decoration: line-through;
        opacity: 0.7;
      }
      .story-body-toggle {
        margin-top: 0.5rem;
        font-size: 0.8rem;
      }
      .story-body {
        margin-top: 0.35rem;
        padding: 0.5rem;
        border-radius: 6px;
        background: var(--bg);
        font-size: 0.8rem;
        white-space: pre-wrap;
        max-height: 14rem;
        overflow: auto;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Plan viewer</h1>
        <div id="meta" class="meta">Loading…</div>
      </div>
      <button type="button" id="reload">Refresh</button>
    </header>
    <main>
      <div id="status"></div>
      <div id="content"></div>
    </main>
    <script>
      const metaEl = document.getElementById('meta');
      const statusEl = document.getElementById('status');
      const contentEl = document.getElementById('content');

      function esc(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      function progressLabel(p) {
        if (!p || typeof p !== 'object') return '';
        const t = p.totalTasks ?? 0;
        const d = p.doneTasks ?? 0;
        const ts = p.totalSteps ?? 0;
        const ds = p.doneSteps ?? 0;
        return `${d}/${t} tasks · ${ds}/${ts} steps`;
      }

      function renderSnapshot(data) {
        const epics = data.epics ?? [];
        if (epics.length === 0) {
          contentEl.innerHTML = '<p class="banner">No epics in this workspace.</p>';
          return;
        }
        const parts = [];
        for (const epic of epics) {
          const active = data.activeEpicId === epic.id;
          const stories = epic.stories ?? [];
          const storyHtml = stories
            .map((story) => {
              const tasks = story.tasks ?? [];
              const taskHtml = tasks
                .map((task) => {
                  const steps = task.steps ?? [];
                  const stepItems = steps
                    .map(
                      (st) =>
                        `<li class="${st.done ? 'done' : ''}">${esc(st.text || '')}</li>`,
                    )
                    .join('');
                  return `<div class="task">
                  <span class="task-title">${esc(task.title)}</span>
                  <span class="badge">${esc(task.status)}</span>
                  <ul class="steps">${stepItems}</ul>
                </div>`;
                })
                .join('');
              const body = story.body ? esc(story.body) : '';
              const bodyBlock = body
                ? `<details class="story-body-toggle"><summary>Story spec</summary><div class="story-body">${body}</div></details>`
                : '';
              return `<div class="story">
              <div class="story-head">
                <span class="story-title">${esc(story.title)}</span>
                <span class="badge">${esc(story.status)}</span>
                <span class="progress">${esc(progressLabel(story.progress))}</span>
              </div>
              ${taskHtml}
              ${bodyBlock}
            </div>`;
            })
            .join('');
          parts.push(`<details class="epic" open>
          <summary>
            <span class="epic-title">${esc(epic.title)}</span>
            <span class="badge">${esc(epic.status)}</span>
            ${active ? '<span class="badge active-focus">Active</span>' : ''}
            <span class="progress">${esc(progressLabel(epic.progress))}</span>
          </summary>
          <div class="epic-body">
            ${epic.description ? `<p class="epic-desc">${esc(epic.description)}</p>` : ''}
            ${storyHtml || '<p class="meta">No stories.</p>'}
          </div>
        </details>`);
        }
        contentEl.innerHTML = parts.join('');
      }

      function renderUninitialized(health) {
        metaEl.textContent = health.cwd
          ? `No .plan at ${health.cwd} (${health.message || 'not initialized'})`
          : 'No plan workspace';
        statusEl.innerHTML = `<div class="banner error">
          <p style="margin:0 0 0.5rem 0">No workspace yet — <strong>Init</strong> matches <code>portal plan init</code> (default <code>.plan/</code>) for <code>PLAN_CWD</code> or the viewer cwd.</p>
          <button type="button" id="init-btn">Init</button>
          <p id="init-feedback" class="meta" style="margin:0.5rem 0 0"></p>
        </div>`;
        const btn = document.getElementById('init-btn');
        const feedback = document.getElementById('init-feedback');
        btn.addEventListener('click', () => runInit(btn, feedback));
      }

      async function runInit(btn, feedback) {
        if (btn.disabled) return;
        btn.disabled = true;
        if (feedback) feedback.textContent = '';
        try {
          const r = await fetch('/api/init', { method: 'POST' });
          const j = await r.json().catch(() => ({}));
          if (r.ok && j.ok) {
            if (feedback) feedback.textContent = '';
            await load();
            statusEl.innerHTML = '<div class="banner">Workspace initialized.</div>';
            setTimeout(() => {
              if (statusEl.innerHTML.includes('Workspace initialized')) statusEl.innerHTML = '';
            }, 2500);
            return;
          }
          if (r.status === 409) {
            const msg = j.message || j.error || 'Already initialized';
            if (feedback) feedback.textContent = msg;
            else statusEl.innerHTML += `<p class="meta">${esc(msg)}</p>`;
          } else {
            const msg = j.error || j.message || r.statusText || 'Init failed';
            if (feedback) feedback.textContent = msg;
            else statusEl.innerHTML += `<p class="meta">${esc(msg)}</p>`;
          }
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          if (feedback) feedback.textContent = msg;
        }
        btn.disabled = false;
      }

      async function load() {
        statusEl.innerHTML = '';
        contentEl.innerHTML = '';
        metaEl.textContent = 'Loading…';
        try {
          const health = await fetch('/api/health').then((r) => r.json());
          if (!health.initialized) {
            renderUninitialized(health);
            return;
          }
          metaEl.textContent = `${health.planRoot} · cwd ${health.cwd}`;
          const snap = await fetch('/api/snapshot').then((r) => {
            if (!r.ok) return r.json().then((j) => Promise.reject(new Error(j.message || r.statusText)));
            return r.json();
          });
          renderSnapshot(snap);
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          statusEl.innerHTML = `<div class="banner error">Could not load plan: ${esc(msg)}</div>`;
          metaEl.textContent = 'Error';
        }
      }

      document.getElementById('reload').addEventListener('click', () => load());
      load();
    </script>
  </body>
</html>
